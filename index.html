<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>HP-Zähler · Die letzte Nacht</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, maximum-scale=1">
<meta name="theme-color" content="#0e0f12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HP-Zähler">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="initiative.css">
</head>
<body>

<header id="bar">
  <button class="nav" id="prev" aria-label="Encounter zurück">‹</button>
  <button id="titel">
    <span class="nr" id="t-nr">–</span>
    <span class="txt">
      <span class="name" id="t-name">lädt …</span>
      <span class="szene" id="t-szene"></span>
    </span>
  </button>
  <button class="nav" id="next" aria-label="Encounter vor">›</button>
  <div class="luecke"></div>
  <div class="summe" id="summe"></div>
  <button class="tool" id="reset" aria-label="Encounter zurücksetzen">⟳</button>
</header>

<main id="feld"></main>

<footer id="fuss">
  <button class="fuss-tool" id="charaktere" aria-label="Charaktere">
    <!-- Echtes Zahnrad: 8 Zaehne, Nabe als Loch (fill-rule evenodd).
         Kontur gerechnet, nicht gemalt - siehe Commit-Historie. -->
    <svg viewBox="0 0 24 24" width="21" height="21" fill="currentColor" fill-rule="evenodd">
      <path d="M9.34 1.33 L14.66 1.33 L14.73 4.06 L15.68 4.45 L17.67 2.57 L21.43 6.33 L19.55 8.32
               L19.94 9.27 L22.67 9.34 L22.67 14.66 L19.94 14.73 L19.55 15.68 L21.43 17.67
               L17.67 21.43 L15.68 19.55 L14.73 19.94 L14.66 22.67 L9.34 22.67 L9.27 19.94
               L8.32 19.55 L6.33 21.43 L2.57 17.67 L4.45 15.68 L4.06 14.73 L1.33 14.66
               L1.33 9.34 L4.06 9.27 L4.45 8.32 L2.57 6.33 L6.33 2.57 L8.32 4.45 L9.27 4.06 Z
               M12 8.1 A3.9 3.9 0 1 0 12 15.9 A3.9 3.9 0 1 0 12 8.1 Z"/>
    </svg>
  </button>
  <button class="fuss-tool" id="ini" aria-label="Initiative aufstellen">
    <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h11M4 18h6"/></svg>
  </button>

  <div class="ini-leiste" id="ini-leiste"></div>

  <div class="ini-runde">
    <button id="runde-ab" aria-label="Runde zurück">‹</button>
    <div class="ini-runde-zahl">
      <span>Runde</span>
      <b id="runde-zahl">1</b>
    </div>
    <button id="runde-auf" aria-label="Runde vor">›</button>
  </div>
</footer>

<div id="sheet" hidden>
  <div class="sheet-box" id="sheet-box">
    <div class="sheet-kopf">
      <span id="sheet-titel"></span>
      <button id="sheet-zu" aria-label="schließen">✕</button>
    </div>
    <div id="sheet-inhalt"></div>
  </div>
</div>

<script src="initiative.js"></script>
<script src="app.js"></script>
</body>
</html>
